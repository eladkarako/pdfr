org.gradle.jvmargs=-Xmx2048m -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8 -Dsun.stderr.encoding=UTF8 -Dsun.stdout.encoding=UTF8 -Duser.timezone=UTC -Djdk.util.zip.disableZip64ExtraFieldValidation=true

org.gradle.parallel=true
org.gradle.caching=false
org.gradle.caching.debug=false
org.gradle.workers.max=2

org.gradle.daemon.idletimeout=180000

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode enables the stronger optimiser pipeline (class merging,
# member value propagation, more aggressive inlining). It is the default in
# recent AGP releases; keeping it explicit documents the intent and prevents a
# future default change from silently reducing optimisation.
android.enableR8.fullMode=true

# Let the resource shrinker use R8's reachability graph instead of the older
# string-scanning heuristic. This removes more unused resources, at the cost of
# a slightly longer release build only.
android.r8.optimizedResourceShrinking=true

# Non-final resource IDs let R8 inline and remove more resource lookups. The
# app never switches on R.id values, so this is safe.
android.nonFinalResIds=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
